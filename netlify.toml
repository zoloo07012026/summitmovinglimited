[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The site was hand-written HTML until this migration, so the old flat URLs are
# what Google has indexed. 301 them onto the Astro directory routes so the
# ranking transfers instead of dying in a 404.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/services/"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/faq.html"
  to = "/faq/"
  status = 301
  force = true

[[redirects]]
  from = "/moving-guide.html"
  to = "/moving-guide/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms/"
  status = 301
  force = true

# robots.txt also disallows /admin/, but a header is the part a crawler cannot
# ignore once someone links to the CMS.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
